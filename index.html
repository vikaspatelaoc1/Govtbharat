            if (!msg || msg.trim() === '' || msg === 'Script error.' || msg === 'undefined' || msg === 'null') return true;
            var low = String(msg).toLowerCase();
            return (
              low.indexOf('websocket') !== -1 ||

              low.indexOf('closed without opened') !== -1 ||
              low.indexOf('quota') !== -1 ||

          };

          window.addEventListener('unhandledrejection', function(event) {
            var reason = (event && event.reason && (event.reason.message || String(event.reason))) || '';
            if (isIgnorable(reason)) {
              event.preventDefault();
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            }
          });

          window.addEventListener('error', function(event) {
            var msg = (event && (event.message || (event.error && event.error.message))) || '';
            if (isIgnorable(msg)) {
              if (event.preventDefault) event.preventDefault();
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            }
          });

          var origErr = console.error;
          console.error = function() {
            var text = '';
            for (var i = 0; i < arguments.length; i++) {
              text += ' ' + (typeof arguments[i] === 'string' ? arguments[i] : (arguments[i] && arguments[i].message ? arguments[i].message : ''));
            }
            if (isIgnorable(text)) return;
            origErr.apply(console, arguments);
          };

          console.warn = function() {
            var text = '';
            for (var i = 0; i < arguments.length; i++) {
              text += ' ' + (typeof arguments[i] === 'string' ? arguments[i] : (arguments[i] && arguments[i].message ? arguments[i].message : ''));
            }
            if (isIgnorable(text)) return;
            origWarn.apply(console, arguments);

        }
